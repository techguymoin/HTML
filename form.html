<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <h1>Form</h1>
    <fieldset>
        
    <div>
    <form action="post">
    <label for="username">name</label>
    <input type="text" id="username" name="username" 
    placeholder="enter your username" autofocus>
    </div>
    <div><input type="radio" id="male" name="gender" value="male">
<label for="male">male</label>
<input type="radio" id="female" name="gender" value="female">
<label for="female">female</label>
</div>
<div>
    <input type="checkbox" name="subscribe" id="subscribe">
    <label for="subscribe">subscribed</label>
</div>
<div>
    <label for="fruits">select you favourite fruit</label>
    <select name="fruits" >
        <option value="cherry">cherry</option>
                <option value="Apple">Apple</option>
                        <option value="Mango">Mango</option>

    </select>
</div>
<div>
    <label for="Reason">Enter your Reason here </label>
    <br>
    <textarea name="Reason" id="Reason" rows="10" cols="20">Enter Reason</textarea>
</div>
</form>
</fieldset>
</body>
</html>
