<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lists</title>
</head>
<body>
    <ul>
        <li>Moin</li>
        <li>Arsalan</li>
        <li>Khaja</li>
        <li>Altamash</li>
        <li>Ashwaq</li>
    </ul>
    <ol>
        <li>Moin</li>
        <li>Arsalan</li>
        <li>Khaja</li>
        <li>Altamash</li>
        <li>Ashwaq</li>
    </ol>
    <ul type="square">
        <li>Moin</li>
        <li>Arsalan</li>
        <li>Khaja</li>    <!--here we are appliying type for bullets more examples are disc,square,circle -->
        <li>Altamash</li>
        <li>Ashwaq</li>
    </ul>
     <ol type="I">
        <li>Moin</li>
        <li>Arsalan</li>
        <li>Khaja</li>     <!--here we are appliying type for number or romannumber more examples are "i","1","a","A" -->
        <li>Altamash</li>
        <li>Altamash</li>
        <li>Ashwaq</li>
    </ol>
</body>
</html>
