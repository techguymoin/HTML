<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic tags</title>
</head>
<body>
    <!--Semantic HTML tags clearly describe the purpose of different parts of a webpage, making the code more readable and accessible.-->
     <header>
        <h1>My Website</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>About Me</h2>
            <p>This is my first semantic HTML page.</p>
        </section>

        <article>
            <h2>My First Article</h2>
            <p>This is an example of an article.</p>
        </article>
    </main>

    <footer>
        <p>© 2026 My Website</p>
        <p>all rights are reserved</p>
    </footer>
</body>
</html>
